name: "Build Nix cache"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-package:
    name: "Cache activation package"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out repository"
        uses: actions/checkout@v4

      - name: "Install Nix"
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - name: "Configure Cachix"
        uses: cachix/cachix-action@v17
        with:
          name: storm-software
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: "Build activation package"
        run: nix build .#homeConfigurations.development.activationPackage
