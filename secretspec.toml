[project]
name = "storm-software"
revision = "1.0"

[providers]
protonpass-agents = { uri = "protonpass://secretspec", ref = { item = "{project}/agents/{key}" } }

# Codex keeps a local router/OAuth recovery path, so a locked vault must not
# block activation or launch. Missing MCP credentials are reported at runtime.
[profiles.agents.defaults]
inherit = false
providers = ["protonpass-agents"]

[profiles.agents]
WEAVE_ROUTER_KEY = { description = "Weave Router client key for Codex", required = false, ref = { item = "storm-software/agents/WEAVE_ROUTER_KEY" } }
CODEX_CHATGPT_ACCOUNT_ID = { description = "ChatGPT account ID used by Codex through Weave", required = false, ref = { item = "storm-software/agents/CODEX_CHATGPT_ACCOUNT_ID" } }
CONTEXT7_AUTHORIZATION = { description = "Complete Authorization header value for remote Context7 MCP", required = false, ref = { item = "storm-software/agents/CONTEXT7_AUTHORIZATION" } }
CONTEXT7_API_KEY = { description = "Context7 API key for the stdio MCP server", required = false, ref = { item = "storm-software/agents/CONTEXT7_API_KEY" } }
FIRECRAWL_API_KEY = { description = "Firecrawl API key for the Firecrawl MCP server", required = false, ref = { item = "storm-software/agents/FIRECRAWL_API_KEY" } }
GITHUB_TOKEN = { description = "GitHub token for accessing GitHub APIs", required = false, ref = { item = "storm-software/agents/GITHUB_TOKEN" } }
